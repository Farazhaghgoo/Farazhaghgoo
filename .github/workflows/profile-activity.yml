name: Refresh profile artwork

on:
  schedule:
    - cron: '23 */6 * * *'   # every 6 hours
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - 'scripts/update_contributions.py'
      - '.github/workflows/profile-activity.yml'

permissions:
  contents: write

concurrency:
  group: profile-artwork
  cancel-in-progress: false

jobs:
  refresh:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v5

      # Reads only public data: the contribution calendar, the public commit search and
      # the profile's day view. It keeps the previous image if anything looks wrong.
      - name: Render control room
        env:
          GITHUB_TOKEN: ${{ github.token }}   # only raises the public search rate limit; it cannot read private repositories
        run: python3 scripts/update_contributions.py

      - name: Commit refreshed artwork
        run: |
          git add assets/contributions.svg assets/contributions.json
          if git diff --cached --quiet; then
            echo "Nothing changed."
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git commit -m "Refresh control room"
          git push
