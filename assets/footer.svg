<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="167" viewBox="0 0 1200 167" role="img" aria-labelledby="t d"><title id="t">Build something worth using. The next thing starts with a conversation.</title><desc id="d"></desc><style>@keyframes spin{to{transform:rotate(360deg)}}@keyframes pulse{50%{opacity:.35}}@keyframes sweep{to{stroke-dashoffset:-120}}.orbit{transform-origin:900px 252px;animation:spin 36s linear infinite}.pulse{animation:pulse 3s ease-in-out infinite}.flow{stroke-dasharray:8 12;animation:sweep 8s linear infinite}@media(prefers-reduced-motion:reduce){*{animation:none!important}}</style><rect x="0" y="0" width="1200" height="167" rx="16" fill="#0B0E14" /><rect x="1" y="1" width="1198" height="165" rx="14" fill="#111722" stroke="#29313C"/><text x="32" y="53" fill="#FF642D" font-family="Consolas,monospace" font-size="16" font-weight="400" letter-spacing="0">THE NEXT THING STARTS WITH A CONVERSATION.</text><text x="30" y="113" fill="#F3EFE5" font-family="Arial,Helvetica,sans-serif" font-size="49" font-weight="700" letter-spacing="-1.225">Build something worth using.</text><path d="M1080 116L1140 56M1092 56H1140V104" fill="none" stroke="#FF642D" stroke-width="4" /></svg>