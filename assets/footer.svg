<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="220" viewBox="0 0 1200 220" role="img" aria-labelledby="t d"><title id="t">Build something worth using. The next thing starts with a conversation.</title><desc id="d">Faraz Haghgoo, Turin, Italy. The link opens LinkedIn.</desc><style>@keyframes nudge{0%,100%{transform:translate(0,0)}50%{transform:translate(6px,-6px)}}.nudge{animation:nudge 2.4s ease-in-out infinite}@media(prefers-reduced-motion:reduce){*{animation:none!important}}</style><defs><clipPath id="cc"><rect x="1" y="1" width="1198" height="218" rx="14"/></clipPath></defs><rect width="1200" height="220" rx="16" fill="#0B0E14"/><rect x="1" y="1" width="1198" height="218" rx="14" fill="#111722" stroke="#29313C"/><g clip-path="url(#cc)"><text x="32" y="58" fill="#FF642D" font-family="Consolas,monospace" font-size="17" font-weight="400" letter-spacing="0">THE NEXT THING STARTS WITH A CONVERSATION.</text><text x="30" y="122" fill="#F3EFE5" font-family="Arial,Helvetica,sans-serif" font-size="52" font-weight="700" letter-spacing="-1.3">Build something worth using.</text><g class="nudge"><path d="M1080 126L1140 66M1092 66H1140V114" fill="none" stroke="#FF642D" stroke-width="4"/></g><path d="M32 160H1168" stroke="#29313C" fill="none"/><text x="32" y="194" fill="#939BA8" font-family="Consolas,monospace" font-size="16" font-weight="400" letter-spacing="1">FARAZ HAGHGOO  /  TURIN, ITALY</text><text x="1168" y="194" fill="#F3EFE5" font-family="Consolas,monospace" font-size="16" font-weight="700" letter-spacing="0" text-anchor="end">SAY HELLO ON LINKEDIN  ↗</text></g></svg>