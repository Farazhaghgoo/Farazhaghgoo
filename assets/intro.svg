<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="200" viewBox="0 0 1200 200" role="img" aria-labelledby="t d"><title id="t">I’m Faraz, a developer and product builder in Turin, Italy.</title><desc id="d">Industrial interfaces by day. Independent experiments whenever an idea won’t leave me alone. I care about the system underneath, the interaction on top, and the details in between.</desc><style>@keyframes beam{to{transform:translateX(1560px)}}.beam{animation:beam 6s linear infinite}@media(prefers-reduced-motion:reduce){*{animation:none!important}}</style><defs><clipPath id="cc"><rect x="1" y="1" width="1198" height="198" rx="14"/></clipPath><linearGradient id="ib"><stop stop-color="#FF642D" stop-opacity="0"/><stop offset=".5" stop-color="#FF642D"/><stop offset="1" stop-color="#FF642D" stop-opacity="0"/></linearGradient></defs><rect width="1200" height="200" rx="16" fill="#0B0E14"/><rect x="1" y="1" width="1198" height="198" rx="14" fill="#111722" stroke="#29313C"/><g clip-path="url(#cc)"><rect class="beam" x="-360" y="1" width="360" height="3" fill="url(#ib)"/><text x="600" y="80" text-anchor="middle" font-family="Arial,Helvetica,sans-serif" font-size="32" fill="#F3EFE5" letter-spacing="-0.4">I’m <tspan font-weight="900">Faraz</tspan>, a developer and product builder in <tspan font-weight="900" fill="#FF642D">Turin, Italy</tspan>.</text><text x="600" y="128" fill="#C9CED6" font-family="Arial,Helvetica,sans-serif" font-size="22" font-weight="400" letter-spacing="0" text-anchor="middle">Industrial interfaces by day. Independent experiments whenever an idea won’t leave me alone.</text><text x="600" y="164" fill="#C9CED6" font-family="Arial,Helvetica,sans-serif" font-size="22" font-weight="400" letter-spacing="0" text-anchor="middle">I care about the system underneath, the interaction on top, and the details in between.</text></g></svg>