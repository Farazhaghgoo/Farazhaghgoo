<!-- https://github.com/DenverCoder1/readme-typing-svg/ -->
<svg xmlns='http://www.w3.org/2000/svg'
    xmlns:xlink='http://www.w3.org/1999/xlink'
    viewBox='0 0 1000 60'
    style='background-color: #00000000;'
    width='1000px' height='60px'>

    <style>
@font-face {
  font-family: 'Fira Code';
  font-style: normal;
  font-weight: 400;
  font-display: fallback;
  src: url(data:font/truetype;base64,) format('truetype');
}
</style>

                <path id='path0'>
                            <!-- Single line -->
                                <animate id='d0' attributeName='d' begin='0s;d2.end'
                    dur='4800ms' fill='remove'
                    values='m0,30 h0 ; m0,30 h1000 ; m0,30 h1000 ; m0,30 h0' keyTimes='0;0.53333333333333;0.86666666666667;1' />
                    </path>
    <text font-family='"Fira Code", monospace' fill='#FF6A2A' font-size='24'
        dominant-baseline='middle'
        x='50%' text-anchor='middle'
        letter-spacing='normal'>
        <textPath xlink:href='#path0'>
            Engineering interfaces. Building products.
        </textPath>
    </text>
        <path id='path1'>
                            <!-- Single line -->
                                <animate id='d1' attributeName='d' begin='d0.end'
                    dur='4800ms' fill='remove'
                    values='m0,30 h0 ; m0,30 h1000 ; m0,30 h1000 ; m0,30 h0' keyTimes='0;0.53333333333333;0.86666666666667;1' />
                    </path>
    <text font-family='"Fira Code", monospace' fill='#FF6A2A' font-size='24'
        dominant-baseline='middle'
        x='50%' text-anchor='middle'
        letter-spacing='normal'>
        <textPath xlink:href='#path1'>
            From industrial systems to independent ideas.
        </textPath>
    </text>
        <path id='path2'>
                            <!-- Single line -->
                                <animate id='d2' attributeName='d' begin='d1.end'
                    dur='4800ms' fill='remove'
                    values='m0,30 h0 ; m0,30 h1000 ; m0,30 h1000 ; m0,30 h0' keyTimes='0;0.53333333333333;0.86666666666667;1' />
                    </path>
    <text font-family='"Fira Code", monospace' fill='#FF6A2A' font-size='24'
        dominant-baseline='middle'
        x='50%' text-anchor='middle'
        letter-spacing='normal'>
        <textPath xlink:href='#path2'>
            Based in Turin. Always building.
        </textPath>
    </text>
</svg>
