<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="352" viewBox="0 0 1200 352" role="img" aria-labelledby="t d"><title id="t">VibeAssist — dashboard + ai advisor</title><desc id="d">A dashboard, ad tracker and AI business advisor for indie app makers. It brings in revenue from Stripe, the App Store and Google Play, and answers questions about your own numbers.</desc><style>@keyframes draw{0%{stroke-dashoffset:1;opacity:1}35%,90%{stroke-dashoffset:0;opacity:1}98%,100%{stroke-dashoffset:0;opacity:0}}.draw{animation:draw 8s ease-in-out infinite}@keyframes area{0%,28%{opacity:0}45%,90%{opacity:1}98%,100%{opacity:0}}.area{animation:area 8s ease-in-out infinite}@keyframes typing{0%,40%{opacity:1}44%,100%{opacity:0}}.typing{opacity:0;animation:typing 8s linear infinite}@keyframes answer{0%,42%{opacity:0}48%,90%{opacity:1}98%,100%{opacity:0}}.answer{animation:answer 8s linear infinite}@keyframes dot{0%,100%{transform:translateY(0);opacity:.4}50%{transform:translateY(-3px);opacity:1}}.dot{animation:dot .9s ease-in-out infinite}@keyframes live{50%{opacity:.25}}.live{animation:live 1.6s ease-in-out infinite}@media(prefers-reduced-motion:reduce){*{animation:none!important}}</style><defs><clipPath id="cc"><rect x="1" y="1" width="1198" height="350" rx="14"/></clipPath></defs><rect width="1200" height="352" rx="16" fill="#0B0E14"/><rect x="1" y="1" width="1198" height="350" rx="14" fill="#111722" stroke="#29313C"/><g clip-path="url(#cc)"><text x="44" y="56" fill="#939BA8" font-family="Consolas,monospace" font-size="15" font-weight="400" letter-spacing="0">03 / WITH AMIRAK-CODE</text><text x="1156" y="56" fill="#F29BD4" font-family="Consolas,monospace" font-size="15" font-weight="700" letter-spacing="0" text-anchor="end">VIBEASSIST.ASSIST365.APP  ↗</text><text x="40" y="128" fill="#F3EFE5" font-family="Arial,Helvetica,sans-serif" font-size="64" font-weight="900" letter-spacing="-1.6">VibeAssist</text><text x="44" y="166" fill="#F29BD4" font-family="Consolas,monospace" fo